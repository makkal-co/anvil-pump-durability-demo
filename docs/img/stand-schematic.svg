<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-labelledby="t d">
  <title id="t">Pump test stand — where every channel is measured</title>
  <desc id="d">Schematic of the invented hydraulic pump endurance stand simulated by the Anvil demo: drive, torque meter, pump under test, load valve, accumulator, cooler circuit, filter and oil tank, with each of the 26 channels and 10 outputs tagged where it acts.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d2733; }
    .h1 { font-size: 19px; font-weight: 700; }
    .sub { font-size: 12px; fill: #5b6775; }
    .lbl { font-size: 13px; font-weight: 600; }
    .sm { font-size: 11px; fill: #5b6775; font-style: italic; }
    .hp { stroke: #1d2733; stroke-width: 4; fill: none; }
    .lp { stroke: #5b6775; stroke-width: 3; fill: none; }
    .cd { stroke: #5b6775; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .sh { stroke: #8a939e; stroke-width: 7; }
    .eq { fill: #f4f6f8; stroke: #1d2733; stroke-width: 2; }
    .ld { stroke: #8a939e; stroke-width: 1.2; }
    .dt { fill: #1d2733; }
    .tag text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #fff; text-anchor: middle; }
    .tag .nm { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #3b4653; }
    .tc rect { fill: #a23b72; } .av rect { fill: #1f5fbf; } .ai rect { fill: #0e7c86; }
    .ao rect { fill: #6b4fbf; } .do rect { fill: #4a5663; } .di rect { fill: #8a6a00; }
    .calc rect { fill: #fff; stroke: #5b6775; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .calc text { fill: #1d2733; }
    .leg { font-size: 11px; fill: #3b4653; }
  </style>
  <rect width="1240" height="800" fill="#ffffff"/>

  <text class="h1" x="40" y="38">One pump test stand — where every channel in the demo is measured</text>
  <text class="sub" x="40" y="60">Invented stand, not a delivered system · 25 measured channels + 1 calculated · 4 analog outputs · 4 digital outputs · 2 digital inputs · tag text is the channel id the demo uses</text>

  <!-- ===== Pipework ===== -->
  <line class="sh" x1="180" y1="190" x2="240" y2="190"/>
  <line class="sh" x1="360" y1="190" x2="420" y2="190"/>
  <path class="hp" d="M520,190 H936"/>
  <path class="hp" d="M870,190 V236"/>
  <path class="lp" d="M984,190 H1120 V410"/>
  <path class="lp" d="M1120,480 V660 H520"/>
  <path class="lp" d="M1120,392 H1050 V610 H1120"/>
  <path class="lp" d="M470,560 V240"/>
  <path class="cd" d="M437,226 L400,262 V560"/>
  <!-- flow arrows -->
  <polygon points="690,660 704,652 704,668" fill="#5b6775"/>
  <polygon points="470,420 462,434 478,434" fill="#5b6775"/>
  <polygon points="1120,232 1112,218 1128,218" fill="#5b6775"/>
  <text class="sm" x="700" y="212">high pressure</text>
  <text class="sm" x="740" y="650">return</text>
  <text class="sm" x="480" y="452">suction</text>
  <text class="sm" x="408" y="546">case drain</text>

  <!-- ===== Equipment ===== -->
  <!-- main drive -->
  <rect class="eq" x="60" y="150" width="120" height="80" rx="8"/>
  <text x="120" y="197" text-anchor="middle" style="font-size:26px;font-weight:700">M</text>
  <text x="120" y="219" text-anchor="middle" style="font-size:11px;fill:#5b6775">main drive · VFD</text>
  <!-- torque meter -->
  <rect class="eq" x="240" y="168" width="120" height="44" rx="4"/>
  <text x="300" y="195" text-anchor="middle" style="font-size:12px">Torque meter</text>
  <!-- pump under test -->
  <circle cx="470" cy="190" r="50" fill="#fff" stroke="#1d2733" stroke-width="3"/>
  <polygon points="518,190 496,176 496,204" fill="#1d2733"/>
  <text class="lbl" x="532" y="232">Pump under test</text>
  <text class="sm" x="532" y="248" style="font-style:normal">axial piston · the unit on test</text>
  <!-- accumulator -->
  <rect class="eq" x="848" y="236" width="44" height="70" rx="22"/>
  <line x1="850" y1="262" x2="890" y2="262" stroke="#1d2733" stroke-width="1.5"/>
  <!-- load valve (proportional relief) -->
  <polygon class="eq" points="936,176 960,190 936,204"/>
  <polygon class="eq" points="984,176 960,190 984,204"/>
  <line x1="942" y1="214" x2="978" y2="168" stroke="#1d2733" stroke-width="1.6"/>
  <polygon points="981,164 969,170 977,177" fill="#1d2733"/>
  <!-- cooler -->
  <rect class="eq" x="1085" y="410" width="70" height="70" rx="4"/>
  <text x="1120" y="424" text-anchor="middle" style="font-size:10px;fill:#5b6775">cooler</text>
  <polyline points="1092,452 1101,436 1111,468 1120,436 1129,468 1139,436 1148,452" fill="none" stroke="#1d2733" stroke-width="1.6"/>
  <!-- cooler fan -->
  <line class="ld" x1="1155" y1="445" x2="1172" y2="445"/>
  <circle class="eq" cx="1188" cy="445" r="16"/>
  <path d="M1188,445 l0,-12 M1188,445 l10,7 M1188,445 l-10,7" stroke="#1d2733" stroke-width="2"/>
  <!-- cooler bypass valve -->
  <polygon class="eq" points="1036,476 1064,476 1050,500"/>
  <polygon class="eq" points="1036,524 1064,524 1050,500"/>
  <!-- filter -->
  <polygon class="eq" points="880,642 898,660 880,678 862,660"/>
  <line x1="880" y1="646" x2="880" y2="674" stroke="#1d2733" stroke-width="1.4" stroke-dasharray="3 2"/>
  <!-- boost pump -->
  <circle class="eq" cx="470" cy="500" r="20"/>
  <polygon points="470,481 461,495 479,495" fill="#1d2733"/>
  <!-- oil tank -->
  <rect x="92" y="588" width="426" height="120" fill="#dbe6f3"/>
  <path d="M92,588 H518" stroke="#1f5fbf" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M90,560 V710 H520 V560" fill="none" stroke="#1d2733" stroke-width="2.5"/>
  <text class="lbl" x="104" y="698">Oil tank</text>
  <!-- safety relay -->
  <rect x="50" y="380" width="190" height="44" rx="4" fill="#fdecea" stroke="#d0312d" stroke-width="1.5"/>
  <text x="145" y="398" text-anchor="middle" style="font-size:12px;font-weight:600">Safety control relay</text>
  <text x="145" y="414" text-anchor="middle" style="font-size:10px;fill:#5b6775">hardware · cuts drive power</text>

  <!-- ===== Leaders ===== -->
  <g class="ld">
    <line x1="85" y1="116" x2="85" y2="150"/>
    <line x1="175" y1="116" x2="175" y2="150"/>
    <line x1="265" y1="116" x2="265" y2="168"/>
    <line x1="350" y1="116" x2="350" y2="168"/>
    <line x1="470" y1="116" x2="470" y2="140"/>
    <line x1="580" y1="116" x2="580" y2="190"/>
    <line x1="680" y1="116" x2="680" y2="190"/>
    <line x1="780" y1="116" x2="780" y2="190"/>
    <line x1="1050" y1="116" x2="1050" y2="190"/>
    <line x1="870" y1="306" x2="870" y2="322"/>
    <line x1="960" y1="208" x2="960" y2="236"/>
    <line x1="1092" y1="246" x2="1120" y2="246"/>
    <line x1="1092" y1="298" x2="1120" y2="298"/>
    <line x1="1092" y1="350" x2="1120" y2="350"/>
    <line x1="1150" y1="310" x2="1120" y2="310"/>
    <line x1="1188" y1="461" x2="1188" y2="470"/>
    <line x1="1150" y1="532" x2="1120" y2="532"/>
    <line x1="1150" y1="582" x2="1120" y2="582"/>
    <line x1="1016" y1="500" x2="1036" y2="500"/>
    <line x1="1010" y1="660" x2="1010" y2="690"/>
    <line x1="880" y1="678" x2="880" y2="690"/>
    <line x1="600" y1="660" x2="600" y2="690"/>
    <line x1="100" y1="230" x2="100" y2="250"/>
    <line x1="160" y1="230" x2="160" y2="300"/>
    <line x1="300" y1="212" x2="300" y2="250"/>
    <line x1="386" y1="310" x2="400" y2="310"/>
    <line x1="386" y1="390" x2="400" y2="390"/>
    <line x1="470" y1="300" x2="510" y2="300"/>
    <line x1="470" y1="370" x2="510" y2="370"/>
    <line x1="490" y1="500" x2="510" y2="500"/>
    <line x1="100" y1="424" x2="100" y2="444"/>
    <line x1="195" y1="424" x2="195" y2="444"/>
  </g>
  <g class="dt">
    <circle cx="580" cy="190" r="3.5"/><circle cx="680" cy="190" r="3.5"/><circle cx="780" cy="190" r="3.5"/>
    <circle cx="1050" cy="190" r="3.5"/><circle cx="1120" cy="246" r="3.5"/><circle cx="1120" cy="298" r="3.5"/>
    <circle cx="1120" cy="350" r="3.5"/><circle cx="1120" cy="532" r="3.5"/><circle cx="1120" cy="582" r="3.5"/>
    <circle cx="1010" cy="660" r="3.5"/><circle cx="600" cy="660" r="3.5"/><circle cx="400" cy="310" r="3.5"/>
    <circle cx="400" cy="390" r="3.5"/><circle cx="470" cy="300" r="3.5"/><circle cx="470" cy="370" r="3.5"/>
    <circle cx="1120" cy="310" r="3.5"/>
  </g>

  <!-- ===== Tags: inputs are round, outputs are square ===== -->
  <!-- above the drive train and discharge line -->
  <g class="tag tc" transform="translate(85,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">motWindT</text><text class="nm" y="-8">Motor winding</text></g>
  <g class="tag tc" transform="translate(175,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">drvBrgT</text><text class="nm" y="-8">Drive bearing</text></g>
  <g class="tag av" transform="translate(265,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">speed</text><text class="nm" y="-8">Shaft speed</text></g>
  <g class="tag av" transform="translate(350,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">torque</text><text class="nm" y="-8">Shaft torque</text></g>
  <g class="tag tc" transform="translate(470,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">pmpBrgT</text><text class="nm" y="-8">Pump bearing</text></g>
  <g class="tag tc" transform="translate(580,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">dispT</text><text class="nm" y="-8">Pump discharge</text></g>
  <g class="tag ai" transform="translate(680,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">dispF</text><text class="nm" y="-8">Discharge flow</text></g>
  <g class="tag av" transform="translate(780,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">sysP</text><text class="nm" y="-8">System pressure</text></g>
  <g class="tag av" transform="translate(1050,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">bypP</text><text class="nm" y="-8">Bypass P</text></g>
  <g class="tag tc" transform="translate(1180,96)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">ambT</text><text class="nm" y="-8">Ambient air (bay)</text></g>

  <!-- drive outputs, calculated channel, safety -->
  <g class="tag ao" transform="translate(100,250)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">ao0</text><text class="nm" y="34">Drive speed command</text></g>
  <g class="tag di" transform="translate(160,300)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">di1</text><text class="nm" y="34">Braking resistor trip</text></g>
  <g class="tag calc" transform="translate(300,250)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">speedDev</text><text class="nm" y="34">Speed deviation (calc.)</text></g>
  <g class="tag do" transform="translate(100,444)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">do3</text><text class="nm" y="34">Hard shutdown</text></g>
  <g class="tag di" transform="translate(195,444)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">di0</text><text class="nm" y="34">Stand power on</text></g>

  <!-- case drain and suction -->
  <g class="tag av" transform="translate(348,300)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">caseP</text><text class="nm" y="34">Case drain P</text></g>
  <g class="tag ai" transform="translate(348,380)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">caseF</text><text class="nm" y="34">Case drain flow</text></g>
  <g class="tag av" transform="translate(548,290)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">sucP</text><text class="nm" y="34">Suction P</text></g>
  <g class="tag tc" transform="translate(548,360)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">sucT</text><text class="nm" y="34">Pump suction</text></g>
  <g class="tag ao" transform="translate(548,490)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">ao1</text><text class="nm" y="34">Boost pump speed</text></g>

  <!-- accumulator and load valve -->
  <g class="tag av" transform="translate(870,322)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">accP</text><text class="nm" y="34">Accumulator</text></g>
  <g class="tag ao" transform="translate(960,236)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">ao3</text><text class="nm" y="34">Load valve opening</text></g>

  <!-- cooler circuit -->
  <g class="tag tc" transform="translate(1054,236)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">hxInT</text><text class="nm" y="34">Cooler inlet</text></g>
  <g class="tag av" transform="translate(1054,288)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">hxInP</text><text class="nm" y="34">Cooler in P</text></g>
  <g class="tag ai" transform="translate(1054,340)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">hxF</text><text class="nm" y="34">Cooler flow</text></g>
  <g class="tag do" transform="translate(1188,300)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">do1</text><text class="nm" y="34">Cooler heater</text></g>
  <g class="tag ao" transform="translate(1188,470)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">ao2</text><text class="nm" y="34">Cooler fan speed</text></g>
  <g class="tag tc" transform="translate(1188,522)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">hxOutT</text><text class="nm" y="34">Cooler outlet</text></g>
  <g class="tag av" transform="translate(1188,572)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">hxOutP</text><text class="nm" y="34">Cooler out P</text></g>
  <g class="tag do" transform="translate(978,490)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">do2</text><text class="nm" y="34">Cooler bypass valve</text></g>

  <!-- return line -->
  <g class="tag tc" transform="translate(1010,690)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">postHxT</text><text class="nm" y="34">After cooler</text></g>
  <g class="tag tc" transform="translate(880,690)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">filtT</text><text class="nm" y="34">Filter housing</text></g>
  <g class="tag tc" transform="translate(600,690)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">sumpT</text><text class="nm" y="34">Return sump</text></g>

  <!-- in the tank -->
  <g class="tag tc" transform="translate(150,608)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">tankT</text><text class="nm" y="34">Oil tank</text></g>
  <g class="tag av" transform="translate(250,608)"><rect x="-38" width="76" height="20" rx="10"/><text y="14">tankLvl</text><text class="nm" y="34">Oil tank level</text></g>
  <g class="tag do" transform="translate(350,608)"><rect x="-38" width="76" height="20" rx="3"/><text y="14">do0</text><text class="nm" y="34">Tank heater</text></g>

  <!-- note -->
  <rect x="600" y="400" width="300" height="92" rx="6" fill="#f4f6f8" stroke="#d3d9df"/>
  <text x="614" y="422" style="font-size:12px;font-weight:600">The wear signal</text>
  <text x="614" y="442" style="font-size:11px;fill:#3b4653">Case drain flow (caseF) climbs as a piston pump’s</text>
  <text x="614" y="458" style="font-size:11px;fill:#3b4653">internal clearances open up. Over a 2 000-hour run</text>
  <text x="614" y="474" style="font-size:11px;fill:#3b4653">its trend matters more than any single reading.</text>

  <!-- ===== Legend ===== -->
  <g transform="translate(40,748)">
    <g class="tag tc"><rect width="34" height="14" rx="7"/></g><text class="leg" x="42" y="11">Thermocouple · NI-9213 · 12</text>
    <g class="tag av" transform="translate(190,0)"><rect width="34" height="14" rx="7"/></g><text class="leg" x="232" y="11">±10 V in · NI-9205 · 10</text>
    <g class="tag ai" transform="translate(360,0)"><rect width="34" height="14" rx="7"/></g><text class="leg" x="402" y="11">4–20 mA in · NI-9203 · 3</text>
    <g class="tag calc" transform="translate(530,0)"><rect width="34" height="14" rx="7"/></g><text class="leg" x="572" y="11">Calculated · 1</text>
    <g class="tag ao" transform="translate(660,0)"><rect width="34" height="14" rx="2"/></g><text class="leg" x="702" y="11">Analog out · NI-9264 · 4</text>
    <g class="tag do" transform="translate(830,0)"><rect width="34" height="14" rx="2"/></g><text class="leg" x="872" y="11">Digital out · NI-9472 · 4</text>
    <g class="tag di" transform="translate(1000,0)"><rect width="34" height="14" rx="2"/></g><text class="leg" x="1042" y="11">Digital in · NI-9435 · 2</text>
  </g>
  <g transform="translate(40,776)">
    <line class="hp" x1="0" y1="7" x2="34" y2="7"/><text class="leg" x="42" y="11">high pressure</text>
    <line class="lp" x1="190" y1="7" x2="224" y2="7"/><text class="leg" x="232" y="11">low pressure / return</text>
    <line class="cd" x1="360" y1="7" x2="394" y2="7"/><text class="leg" x="402" y="11">case drain</text>
    <text class="leg" x="530" y="11">Round tags are measured inputs · square tags are outputs · the demo’s stands all share this map</text>
  </g>
</svg>
